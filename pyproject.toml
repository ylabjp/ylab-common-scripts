[project]
name = "ylabcommon"
version = "0.3.1"
description = "Integrated pipeline system for MRI data analysis - Automated preprocessing, analysis tasks (DSI/VBM/FreeSurfer), and model training"
readme = "README.md"
requires-python = "===3.12.9"
dependencies = [
    "h5py>=3.15.1",
    "matplotlib>=3.7.0",
    # 3.0.4 は access violation を起こすため除外する(修正版を待つ)。
    # DeepLabCut が pandas<3 を要求するため下限のみとし 2.x も許容する。
    # 2.3.3 / 3.0.3 の双方でテスト・pandas 利用箇所の出力一致を確認済み。
    "pandas>=2.3.3,!=3.0.4",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.3",
    #"scipy>=1.16.3",
    "scipy<=1.16.3",    # 何かの都合で。定期的に確認する。
    "seaborn>=0.13.2",
    "gdown>=5.0.0",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "google-api-python-client",
    "python-dotenv>=1.2.1",
    "questionary>=2.1.1",
    "numpy",
    "tifffile",
    "lxml",
    "requests",
    "imagecodecs",
    "bioio>=1.3.0",
    "bioio-ome-tiff",
    "tifffile",
    "bioio-tifffile",
    "bioio-ome-tiff",
    "ome-types",
    "xarray",
    "dask[array]",
    "scikit-posthocs>=0.14.0",
]
license = {text = "MIT"}

[optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.5",
]

#Need to check which one keep by Sho
#[build-system]
#requires = ["hatchling","setuptools>=61.0"]
#build-backend = "setuptools.build_meta"

[tool.hatch.build.targets.wheel]
packages = [
    "src/ylabcommon",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

#[optional-dependencies]
#dev = [
#    "ipykernel>=6.29.5",
#    #"pytest>=8.3.5",
#    "pytest>=9.0.1",
#    "pytest-mock"
#]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-mock",
    "mypy>=1.11",
]

[project.optional-dependencies]
zarr = [
  "bioio-ome-zarr",
  "ome-zarr",
  "zarr",
]

# 型注釈は **誰かが確かめていないとただのコメント** になり、やがて嘘になる。
#   uv run mypy
# で出荷するパッケージ全体を検査する。tests/test_type_annotations.py が
# 「注釈の付いている割合が下がっていないこと」も見ている。
[tool.mypy]
python_version = "3.12"
files = ["src/ylabcommon"]
plugins = ["pydantic.mypy"]
# bioio / tifffile / gdown などは型情報を配っていない。無いものは Any として
# 扱う —— 「スタブが無い」という指摘が何百と出ると本当の指摘が埋もれる。
ignore_missing_imports = true
# src はパッケージではなく置き場なので、module 名は ylabcommon.* から始まる。
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
# **リポジトリのルートに置くこと。** これは以前 tests/pytest.ini にあったが、
# ルートから素の `pytest` を実行すると pytest はルートの設定ファイルしか探さない
# ので、その設定は使われていなかった。結果 testpaths が効かず、収集も
# pythonpath も指定と違う状態で走っていた。
testpaths = ["tests", "src"]

# src 配下にも実装の隣に置かれたテスト (*_test.py) がある。
# 以前はここに他人の作業マシンの絶対パス
# (/Users/tanmay/.../thorlab_microscopy/src/) が並んでおり、
# そのマシン以外では死んだ設定だった。
pythonpath = ["src"]

# **実際に使われているものを登録する。** 以前は使われていない slow / integration
# だけが登録され、使われている 3 つは未登録だった (--strict-markers を入れた
# 途端に落ちる状態)。
markers = [
    "unit: no external data or network",
    "integration_bioio: needs a real local dataset (--local-tiff-dir / --local-xml)",
    "gdrive: needs Google Drive credentials (--gdrive-folder / --gdrive-sa-json)",
]
